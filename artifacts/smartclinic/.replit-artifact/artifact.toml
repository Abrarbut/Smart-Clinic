kind = "web"
previewPath = "/"
title = "Smart Clinic"
version = "1.0.0"
id = "artifacts/smartclinic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19304

[services.development]
run = "pnpm --filter @workspace/smartclinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartclinic", "run", "build" ]
publicDir = "artifacts/smartclinic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19304"
BASE_PATH = "/"
