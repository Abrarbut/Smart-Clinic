version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartclinic-db
    environment:
      POSTGRES_USER: smartclinic_user
      POSTGRES_PASSWORD: love6767
      POSTGRES_DB: smartclinic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclinic_user -d smartclinic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartclinic-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smartclinic-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smartclinic_user:love6767@postgres:5432/smartclinic
      SESSION_SECRET: lovelovelove
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartclinic-network
    restart: unless-stopped

  # Frontend Web Server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartclinic-frontend
    ports:
      - "8081:80"
    networks:
      - smartclinic-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: smartclinic-nginx
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - smartclinic-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  smartclinic-network:
    driver: bridge
